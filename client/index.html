<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Techwiz GenAI</title>
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
      if (typeof customElements !== "undefined") {
        const origDef = customElements.define;
        customElements.define = function(name, constructor, options) {
          try {
            if (customElements.get(name)) return;
            return origDef.call(this, name, constructor, options);
          } catch (e) {}
        };
      }
      const origLog = console.log, origInfo = console.info, origWarn = console.warn;
      const filterConsole = (fn) => function(...args) {
        try {
          const text = args.map((a) => (typeof a === "object" ? JSON.stringify(a) : String(a || ""))).join(" ");
          if (/puter|apps\.puter\.com|puter-dialog|_____|____|\|\s*_\\/i.test(text)) return;
        } catch (e) {}
        return fn.apply(this, args);
      };
      console.log = filterConsole(origLog);
      console.info = filterConsole(origInfo);
      console.warn = filterConsole(origWarn);
      window.puter = window.puter || {};
      window.puter.quiet = true;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
